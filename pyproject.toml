[project]
name = "safaribooks"
version = "0.1.0"
description = "Download books from O'Reilly Learning (Safari Books Online) as EPUB"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "lxml>=4.1.1",
    "pillow>=12.3.0",
    "requests>=2.20.0",
    "tinycss2>=1.5.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
