[project]
name = "safaribooks"
version = "0.1.0"
description = "Download books from O'Reilly Learning (Safari Books Online) as EPUB"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lxml>=4.1.1",
    "pillow>=12.3.0",
    "requests>=2.20.0",
    "tinycss2>=1.5.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "calibre: needs Calibre's ebook-polish on PATH (skipped where it is not installed; run by the calibre CI job)",
]
